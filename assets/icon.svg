<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6278f7"/>
      <stop offset="100%" style="stop-color:#2e48e8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- Subtle inner glow ring -->
  <rect width="512" height="512" rx="110" ry="110" fill="none" stroke="#405CF5" stroke-width="2" opacity="0.3"/>

  <!-- Blue accent bar on left of K -->
  <rect x="148" y="128" width="28" height="256" rx="14" fill="url(#accent)" filter="url(#glow)"/>

  <!-- K top-right diagonal arm -->
  <polygon points="176,256 340,128 378,128 214,256" fill="url(#accent)" filter="url(#glow)"/>

  <!-- K bottom-right diagonal arm -->
  <polygon points="176,256 340,384 378,384 214,256" fill="url(#accent)" filter="url(#glow)"/>
</svg>

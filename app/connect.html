<!DOCTYPE html>
<html>
<head>
    <title></title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="connect.css" />
    <meta name="minimizeable" content="0">
    <meta name="maximizeable" content="0">
    <meta name="titlebar-themecolor" content="#0f0f0f">
</head>
<body>
    <div class="form-wrapper">
        <div class="logo">
            <div class="logo-icon">K</div>
            <h1>KlientKonnect</h1>
            <p>Connect to your server</p>
        </div>
        <form class="form">
            <div class="field">
                <label for="username-input">Username</label>
                <input type="text" id="username-input" placeholder="Enter username" autocomplete="off">
            </div>
            <div class="field">
                <label for="password-input">Password</label>
                <input type="password" id="password-input" placeholder="Enter password">
            </div>
            <div class="field">
                <label for="server-input">Server</label>
                <input type="text" id="server-input" placeholder="server.example.com" autocomplete="off">
            </div>
            <span id="error" class="error"></span>
            <button type="submit" class="btn-primary">Connect</button>
        </form>
    </div>
    <script src="connect.js"></script>
</body>
</html>
